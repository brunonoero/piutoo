<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Piootoo">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ad0bb"/>
      <stop offset=".55" stop-color="#0e8a8f"/>
      <stop offset="1" stop-color="#0b4f74"/>
    </linearGradient>
    <linearGradient id="luce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#fondo)"/>
  <rect width="64" height="64" rx="16" fill="url(#luce)"/>
  <!-- la "p": gambo, occhiello e il punto del segnale -->
  <rect x="15" y="13" width="7.5" height="40" rx="3.75" fill="#fff"/>
  <circle cx="34.5" cy="28.5" r="12" fill="none" stroke="#fff" stroke-width="7.5"/>
  <circle cx="34.5" cy="28.5" r="4.2" fill="#ffc655"/>
</svg>
